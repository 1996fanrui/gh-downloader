proxy_cache_path /var/cache/nginx/gh-downloader
    levels=1:2
    keys_zone=download_cache:100m
    max_size=20g
    inactive=7d
    use_temp_path=off;

upstream gh_downloader_app {
    server app:8080;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    location /dl/ {
        proxy_pass http://gh_downloader_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Fetch a complete object from the app on a cache miss so later range
        # requests can be served from the same cached file.
        proxy_set_header Range "";
        proxy_set_header If-Range "";
        proxy_force_ranges on;

        proxy_buffering on;
        proxy_cache download_cache;
        proxy_cache_key $request_uri;
        proxy_cache_valid 200 7d;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 30m;
        proxy_cache_lock_age 30m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        add_header X-Download-Cache $upstream_cache_status always;
    }

    location / {
        proxy_pass http://gh_downloader_app;
        proxy_http_version 1.1;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
