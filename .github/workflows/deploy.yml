name: Deploy
run-name: Deploy gh-downloader | ref=${{ github.ref_name }}

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy gh-downloader
    runs-on: [self-hosted, gh-downloader]
    concurrency:
      group: gh-downloader-deploy
      cancel-in-progress: false
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      GH_DOWNLOADER_GITHUB_TOKEN: ${{ secrets.GH_DOWNLOADER_GITHUB_TOKEN }}
      GH_DOWNLOADER_PORT: ${{ vars.GH_DOWNLOADER_PORT }}
      GH_DOWNLOADER_BIND: 127.0.0.1
      GH_DOWNLOADER_NGINX_CACHE_DIR: ~/.cache/gh-downloader/nginx
      GH_DOWNLOADER_PUBLIC_URL: https://gh-downloader.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy with Docker Compose
        shell: bash
        run: bash scripts/deploy.sh
